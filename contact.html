<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/contact.css">
    <title>Contact</title>
</head>

<body id="content">
    <header class="works-header">
        <div class="header-left">
            <div class="brand-logo">
                <img src="./images/Logo.png" alt="Logo" class="logo-image">
            </div>
        </div>
        <nav class="header-nav">
            <a href="./index.html" class="nav-link">Home</a>
            <span class="nav-separator">/</span>
            <a href="./works.html" class="nav-link">Works</a>
            <span class="nav-separator">/</span>
            <a href="./contact.html" class="nav-link nav-active">Contact</a>
        </nav>
    </header>

    <main class="contact-main">
        <!-- Get in Touch Heading -->
        <h1 class="contact-heading">Get in Touch</h1>

        <!-- Profile Card -->
        <div class="profile-card">
            <div class="profile-content">
                <div class="profile-avatar">
                    <img src="./images/profil.jpg" alt="Charlotte Lavaux">
                </div>
                <div class="profile-info">
                    <h2 class="profile-name">Charlotte Lavaux</h2>
                    <p class="profile-title">Student at IUT Tarbes</p>
                    <p class="profile-description">
                        Lorem ipsum dolor sit amet. Ut sequi ipsa et autem assumenda sit tempora cumque qui quasi quia et consectetur similique. Et inventore dicta qui.
                    </p>
                    <a href="http://www.linkedin.com" class="view-profile-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                        </svg>
                        <span>View Profile</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Email Heading -->
        <h2 class="email-heading">Or send me an Email!</h2>

        <!-- Contact Form Card -->
        <div class="contact-form-card">
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Name">
                </div>
                <div class="form-group">
                    <label for="mail">Mail</label>
                    <input type="email" id="mail" name="mail" class="form-input" placeholder="Mail">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-textarea" rows="5" placeholder="Type your message here ..."></textarea>
                </div>
            </form>
        </div>
        
        <!-- Submit Button (outside form, below form card) -->
        <div class="submit-button-wrapper">
            <button type="submit" form="contactForm" class="submit-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                <span>Envoyer</span>
            </button>
        </div>
    </main>
</body>
</html>
